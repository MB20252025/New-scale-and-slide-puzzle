<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Scale Room</title>
<link rel="preload" as="image" href="scalebookpuzzlebackground.png">
<link rel="preload" as="image" href="scalepart.png">
<link rel="preload" as="image" href="bookoverlay.png">
<style>
:root{
    /* =========================================================
       ★★★ EDIT THESE TO POSITION / SCALE THE TWO PICTURES ★★★
       ========================================================= */

    /* ---------- SCALE PART  (scalepart.png) ---------- */
    --scalepart-w:      55%;   /* base width — % of the background width */
    --scalepart-x:      0px;   /* nudge left (-) / right (+)            */
    --scalepart-y:      0px;   /* nudge up   (-) / down  (+)            */
    --scalepart-scale:  1;     /* grow / shrink (1 = natural)           */

    /* ---------- BOOK OVERLAY (bookoverlay.png) ---------- */
    --bookoverlay-w:      40%;
    --bookoverlay-x:      0px;
    --bookoverlay-y:      0px;
    --bookoverlay-scale:  1;

    /* ---------- palette ---------- */
    --gold:    #f0b429;
    --gold-hi: #ffd066;
    --gold-lo: #d99a1a;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:#0a0705;}

body{
    min-height:100vh;
    background:#0a0705;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    opacity:0;
    transition:opacity .45s ease;
}
body.ready{opacity:1;}

/* ---------- Back buttons ---------- */
.back-to-desk,
.back-to-puzzles{
    position:fixed;top:14px;padding:9px 20px;border-radius:40px;
    font-family:'Courier New',monospace;font-size:.72rem;font-weight:bold;
    letter-spacing:.22em;text-transform:uppercase;text-decoration:none;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:9999;transition:background .18s ease,border-color .18s ease;
}
.back-to-puzzles{
    left:14px;background:rgba(15,12,8,.85);
    border:1px solid #8a6e42;color:#eace9f;
}
.back-to-puzzles:hover{background:rgba(60,40,15,.95);border-color:#d8ab6a;}
.back-to-desk{
    right:14px;background:rgba(15,42,63,.85);
    border:1px solid rgba(182,139,92,.4);color:#eace9f;
}
.back-to-desk:hover{background:#2a5a6a;border-color:#eace9f;}

/* ---------- Room ---------- */
.room{
    position:relative;
    width:100%;
    max-width:100%;
    line-height:0;
    overflow:visible;
}

.room-bg{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

.hotspot{
    position:absolute;
    top:0;
    left:50%;
    display:block;
    height:auto;
    max-width:none;
    transform-origin:top center;
    cursor:pointer;
    user-select:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    transition:filter .18s ease;
    will-change:transform;
}

#scalePart{
    width:var(--scalepart-w);
    z-index:3;
    transform:translate(-50%,0)
              translate(var(--scalepart-x),var(--scalepart-y))
              scale(var(--scalepart-scale));
}

#bookOverlay{
    width:var(--bookoverlay-w);
    z-index:2;
    transform:translate(-50%,0)
              translate(var(--bookoverlay-x),var(--bookoverlay-y))
              scale(var(--bookoverlay-scale));
}

.hotspot:hover{
    filter:drop-shadow(0 0 14px rgba(240,180,41,.75)) brightness(1.07);
}
.hotspot:active{
    filter:drop-shadow(0 0 8px rgba(240,180,41,.9)) brightness(.94);
}

/* ---------- Hint ---------- */
.hint{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:9998;
    padding:9px 20px;
    border-radius:30px;
    background:rgba(10,7,5,.78);
    border:1px solid rgba(240,180,41,.35);
    color:#e8d3a3;
    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    white-space:nowrap;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    pointer-events:none;
    opacity:1;
    transition:opacity 1s ease;
}
.hint.hide{opacity:0;}

@media (max-width:420px){
    .back-to-desk,.back-to-puzzles{
        font-size:.66rem;padding:8px 14px;letter-spacing:.18em;
    }
    .hint{font-size:.6rem;padding:8px 14px;letter-spacing:.1em;}
}
</style>
</head>
<body>

<a class="back-to-puzzles" href="puzzles.html">← Puzzles</a>
<a class="back-to-desk"    href="desk.html">← Desk</a>

<div class="room">
    <img class="room-bg" src="scalebookpuzzlebackground.png" alt="">

    <!-- bookcase — always available -->
    <img class="hotspot" id="bookOverlay" src="bookoverlay.png" alt="Bookcase" draggable="false">

    <!-- scale parts — opens the scale puzzle -->
    <img class="hotspot" id="scalePart" src="scalepart.png" alt="Scale parts" draggable="false">
</div>

<div class="hint" id="hint">Tap the bookcase · Tap the scale</div>

<script>
(function(){
    "use strict";

    document.getElementById('bookOverlay').addEventListener('click', function(){
        window.location.href = 'book.html';
    });

    document.getElementById('scalePart').addEventListener('click', function(){
        window.location.href = 'scale.html';
    });

    function markReady(){ document.body.classList.add('ready'); }
    window.addEventListener('load', markReady);
    if (document.readyState === 'complete') markReady();

    var hint = document.getElementById('hint');
    setTimeout(function(){ hint.classList.add('hide'); }, 4200);
})();
</script>
</body>
</html>
